name: Update TryHackMe Badge

on:
  schedule:
    - cron: '0 0 * * *' # runs daily at midnight UTC
  workflow_dispatch: # allow manual runs

jobs:
  update-badge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update README with latest badge
        run: |
          BADGE_URL="https://tryhackme-badges.s3.amazonaws.com/httpsayush.png"
          echo "### 🧠 TryHackMe Progress" > README.md
          echo "<img src=\"$BADGE_URL\" alt=\"TryHackMe Badge\" width=\"300\"/>" >> README.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "Update TryHackMe badge"
          git push
